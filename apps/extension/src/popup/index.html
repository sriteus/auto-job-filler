<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Job Application Agent</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1f1f1f;
        background: #fff;
      }
      .container {
        padding: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e8e8e8;
      }
      .logo {
        width: 32px;
        height: 32px;
        background: #1890ff;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 16px;
      }
      .title {
        font-size: 16px;
        font-weight: 600;
      }
      .subtitle {
        font-size: 12px;
        color: #8c8c8c;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .status-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8c8c8c;
      }
      .status-indicator.connected {
        background: #52c41a;
      }
      .status-indicator.scanning {
        background: #faad14;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .status-text {
        font-size: 13px;
        color: #595959;
      }
      .btn {
        width: 100%;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background: #1890ff;
        color: white;
      }
      .btn-primary:hover {
        background: #40a9ff;
      }
      .btn-primary:disabled {
        background: #d9d9d9;
        cursor: not-allowed;
      }
      .btn-secondary {
        background: #f5f5f5;
        color: #1f1f1f;
        border: 1px solid #d9d9d9;
      }
      .btn-secondary:hover {
        background: #e8e8e8;
      }
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 16px 0;
        color: #bfbfbf;
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e8e8e8;
      }
      .info-section {
        font-size: 12px;
        color: #8c8c8c;
      }
      .info-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .info-label {
        color: #bfbfbf;
      }
      .info-value {
        color: #595959;
        font-family: monospace;
      }
      .footer {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #e8e8e8;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .version {
        font-size: 11px;
        color: #bfbfbf;
      }
      .links {
        display: flex;
        gap: 16px;
      }
      .links a {
        font-size: 11px;
        color: #1890ff;
        text-decoration: none;
      }
      .links a:hover {
        text-decoration: underline;
      }
      .hidden {
        display: none !important;
      }
      .auth-panel {
        display: grid;
        gap: 8px;
        padding: 12px;
        background: #f5f5f5;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .auth-panel input {
        width: 100%;
        padding: 8px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
      }
      .auth-error {
        color: #cf1322;
        font-size: 12px;
      }
      .field-list {
        max-height: 200px;
        overflow-y: auto;
        margin-top: 8px;
      }
      .field-item {
        padding: 8px;
        background: #fafafa;
        border-radius: 4px;
        margin-bottom: 4px;
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .field-name {
        color: #1f1f1f;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
      }
      .field-type {
        color: #8c8c8c;
        font-family: monospace;
        font-size: 11px;
      }
      .field-type.required::after {
        content: ' *';
        color: #ff4d4f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">AI</div>
        <div>
          <div class="title">AI Job Application Agent</div>
          <div class="subtitle">V1 - Project Foundation</div>
        </div>
      </div>

      <div class="status" id="status">
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="status-text" id="statusText">Ready to scan</div>
      </div>

      <div class="auth-panel" id="authPanel">
        <strong>Connect your profile</strong>
        <input id="authEmail" type="email" placeholder="Email" />
        <input id="authPassword" type="password" placeholder="Password" />
        <button class="btn btn-secondary" id="authBtn">Sign in to Supabase</button>
        <span class="auth-error" id="authError"></span>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" id="scanBtn"><span>🔍</span> Scan Page for Forms</button>
        <button class="btn btn-primary hidden" id="fillBtn"><span>✨</span> Fill Form</button>
        <button class="btn btn-secondary" id="openDashboardBtn">
          <span>📊</span> Open Dashboard
        </button>
      </div>

      <div class="divider">Detected Fields</div>

      <div class="field-list" id="fieldList">
        <div class="info-section" style="text-align: center; padding: 16px">
          Click "Scan Page" to detect form fields
        </div>
      </div>

      <div class="footer">
        <span class="version">v1.0.0</span>
        <div class="links">
          <a href="#" id="settingsLink">Settings</a>
          <a href="#" id="helpLink">Help</a>
        </div>
      </div>
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
